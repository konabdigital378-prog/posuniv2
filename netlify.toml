[build]
  publish = "dist"
  command = "node build.js"

[[redirects]]
  from = "/menu"
  to = "/portal.html"
  status = 200

[[redirects]]
  from = "/menu/*"
  to = "/portal.html"
  status = 200

[[redirects]]
  from = "/orders"
  to = "/portal.html"
  status = 200

[[redirects]]
  from = "/suivi"
  to = "/portal.html"
  status = 200

[[redirects]]
  from = "/iphone"
  to = "/portal.html"
  status = 200

[[redirects]]
  from = "/portal"
  to = "/portal.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
